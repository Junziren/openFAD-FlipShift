<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>openFAD FlipShift Preview</title>
<style>
:root{--bg:#101416;--panel:#171d20;--line:#343b3f;--text:#dbe3e3;--muted:#879092;--mint:#54ddb7;--amber:#efad3e;--cyan:#4aa7bd}
*{box-sizing:border-box}body{margin:0;background:#090b0c;color:var(--text);font:12px Arial,sans-serif;letter-spacing:0}.wrap{min-height:100vh;display:grid;place-items:center;padding:28px}.plugin{width:min(1160px,100%);height:620px;background:var(--bg);border:1px solid var(--line);display:grid;grid-template-rows:44px 1fr 170px;box-shadow:0 18px 54px #0008}.bar{display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}.brand{font-size:17px;font-weight:700;color:var(--mint)}.subtitle{color:var(--muted);margin-left:auto}.dot{width:8px;height:8px;border-radius:50%;background:var(--mint)}.screen{position:relative;display:grid;grid-template-rows:1fr 104px;min-height:0}.scope,.water{position:relative;overflow:hidden}.water{border-top:1px solid var(--line);background:#0d1114}.pivot{position:absolute;left:0;right:0;height:1px;top:39%;background:var(--amber)}.pivot:after{content:"PIVOT";position:absolute;left:12px;top:-17px;color:var(--amber);font-size:10px}.flipline{position:absolute;inset:0;background:linear-gradient(180deg,transparent 33%,rgba(239,173,62,.08),transparent 63%);pointer-events:none}canvas{display:block;width:100%;height:100%}.controls{display:grid;grid-template-columns:2fr repeat(7,1fr) 130px;border-top:1px solid var(--line)}.cell{border-right:1px solid var(--line);padding:13px 12px;min-width:0}.cell:last-child{border-right:0}.label{color:var(--muted);font-size:10px;margin-bottom:10px}.select,button{height:32px;border:1px solid #465054;background:#111719;color:var(--text);padding:0 8px;width:100%}button.on{border-color:var(--amber);color:var(--amber)}.knob{display:grid;place-items:center;gap:6px}.dial{width:42px;height:42px;border-radius:50%;border:5px solid #3f494d;border-top-color:var(--mint);position:relative}.dial.amber{border-top-color:var(--amber)}.dial:after{content:"";position:absolute;left:50%;top:5px;width:2px;height:14px;background:var(--text);transform-origin:50% 16px;transform:translateX(-50%) rotate(var(--rot,40deg))}.value{font-size:11px;color:var(--text);text-align:center}.meter{display:flex;gap:8px;align-items:end;height:78px}.barMeter{width:12px;background:linear-gradient(to top,var(--mint) var(--level),#273033 var(--level));border:1px solid #263034;height:100%}input[type=range]{width:100%;accent-color:var(--mint)}@media(max-width:860px){.plugin{height:auto;grid-template-rows:44px 360px auto}.controls{grid-template-columns:repeat(2,1fr)}.cell{min-height:110px}}
</style>
</head>
<body>
<div class="wrap">
  <main class="plugin">
    <header class="bar"><div class="brand">openFAD FLIPSHIFT</div><div class="subtitle">SPECTROGRAM / FLIP / SHIFT</div><span class="dot"></span></header>
    <section class="screen">
      <div class="scope"><canvas id="scope"></canvas><div class="pivot"></div><div class="flipline"></div></div>
      <div class="water"><canvas id="slice"></canvas></div>
    </section>
    <section class="controls">
      <div class="cell"><div class="label">MODE</div><select id="mode" class="select"></select></div>
      <div class="cell"><div class="label">SHIFT</div><div class="knob"><div class="dial amber" id="shiftDial"></div><div class="value" id="shiftValue">+100 Hz</div><input id="shift" type="range" min="-2000" max="2000" value="100"></div></div>
      <div class="cell"><div class="label">SCALE</div><div class="knob"><div class="dial" id="scaleDial"></div><div class="value" id="scaleValue">1.00x</div><input id="scale" type="range" min="25" max="400" value="100"></div></div>
      <div class="cell"><div class="label">PIVOT</div><div class="knob"><div class="dial amber" id="pivotDial"></div><div class="value" id="pivotValue">1.00k</div><input id="pivot" type="range" min="20" max="20000" value="1000"></div></div>
      <div class="cell"><div class="label">AMOUNT</div><div class="knob"><div class="dial" id="amountDial"></div><div class="value" id="amountValue">50%</div><input id="amount" type="range" min="0" max="100" value="50"></div></div>
      <div class="cell"><div class="label">WIDTH/Q</div><div class="knob"><div class="dial" id="widthDial"></div><div class="value" id="widthValue">1.00</div><input id="width" type="range" min="5" max="800" value="100"></div></div>
      <div class="cell"><div class="label">MIX</div><div class="knob"><div class="dial" id="mixDial"></div><div class="value" id="mixValue">50%</div><input id="mix" type="range" min="0" max="100" value="50"></div></div>
      <div class="cell"><div class="label">FREEZE</div><button id="freeze">OFF</button></div>
      <div class="cell"><div class="label">OUTPUT</div><div class="meter"><div class="barMeter" style="--level:72%"></div><div class="barMeter" style="--level:66%"></div></div></div>
    </section>
  </main>
</div>
<script>
const modes=["Off","Detune +/-","Smear","Spread +/-","Harmonics","Subharm","Gate","Robotize","Shift","Mirror","Peak Follow","Peak Oct +12","Peak Oct -12","Peak Hmx +12","Peak Hmx -12","Harm Sweep","Shepard","Shepard W","Comb","Pitch Blend","Pitch Shift","Phase Twist"];
const mode=document.getElementById("mode");modes.forEach((m,i)=>{const o=document.createElement("option");o.textContent=m;o.value=i;if(m==="Mirror")o.selected=true;mode.appendChild(o)});
const scope=document.getElementById("scope"),slice=document.getElementById("slice"),ctx=scope.getContext("2d"),sctx=slice.getContext("2d"),pivotLine=document.querySelector(".pivot"),reference=new Image(),referenceBuffer=document.createElement("canvas"),referenceCtx=referenceBuffer.getContext("2d");reference.src="reference-spectrogram.png";
const shift=document.getElementById("shift"),scale=document.getElementById("scale"),pivot=document.getElementById("pivot"),amount=document.getElementById("amount"),width=document.getElementById("width"),mix=document.getElementById("mix"),freeze=document.getElementById("freeze");
const nyquist=24000;let frozen=false,t=0,referenceWidth=0,referenceHeight=0;
freeze.onclick=()=>{frozen=!frozen;freeze.textContent=frozen?"ON":"OFF";freeze.classList.toggle("on",frozen)};
function resize(){referenceWidth=referenceHeight=0;for(const c of [scope,slice]){const r=c.getBoundingClientRect();c.width=Math.max(1,Math.floor(r.width*2));c.height=Math.max(1,Math.floor(r.height*2));c.getContext("2d").setTransform(2,0,0,2,0,0)}}window.onresize=resize;resize();
function knob(id,n){document.getElementById(id).style.setProperty("--rot",`${-135+n*270}deg`)}
function frequencyToPosition(hz){const norm=hz/nyquist;if(norm<0||norm>1)return null;return Math.log10(1+norm*99)/2}
function positionToFrequency(position){return ((10**(position*2)-1)/99)*nyquist}
function pivotPosition(){return frequencyToPosition(+pivot.value)??0}
function updateLabels(){const sh=+shift.value,sc=+scale.value/100,pv=+pivot.value,am=+amount.value,wi=+width.value/100,mi=+mix.value;shiftValue.textContent=`${sh>=0?"+":""}${sh} Hz`;scaleValue.textContent=`${sc.toFixed(2)}x`;pivotValue.textContent=pv>=1000?`${(pv/1000).toFixed(2)}k`:`${pv} Hz`;amountValue.textContent=`${am}%`;widthValue.textContent=wi.toFixed(2);mixValue.textContent=`${mi}%`;pivotLine.style.top=`${(1-pivotPosition())*100}%`;knob("shiftDial",(sh+2000)/4000);knob("scaleDial",(sc-.25)/3.75);knob("pivotDial",Math.log(pv/20)/Math.log(1000));knob("amountDial",am/100);knob("widthDial",(wi-.05)/7.95);knob("mixDial",mi/100)}
[shift,scale,pivot,amount,width,mix,mode].forEach(e=>e.oninput=updateLabels);updateLabels();
function transformFreq(position){const md=modes[+mode.value],am=+amount.value/100,sc=+scale.value/100,sh=+shift.value,pv=+pivot.value,destination=positionToFrequency(position);let source=destination;if(md==="Mirror")source=pv-(destination-pv)*sc;if(md==="Shift")source=destination-sh*am;if(md==="Detune +/-")source=pv+(destination-pv)/(1+sh*.00005*am);if(md==="Pitch Shift"||md==="Pitch Blend")source=pv+(destination-pv)/sc;if(md==="Spread +/-")source=destination-sh*am*Math.sin(t*.7);if(md==="Subharm")source=destination*(1+Math.floor(am*3));return frequencyToPosition(source)}
function energyAt(x,y){const md=modes[+mode.value],am=+amount.value/100,wi=+width.value/100;let f=transformFreq(1-y),e=0;if(f===null)return 0;const vibrato=Math.sin(x*18+t*.6)*.006;for(let base of [.18,.225,.27,.34,.42,.52,.64,.76]){for(let h=1;h<=9;h++){let line=base*h*.105+vibrato;if(line>.98)continue;let d=Math.abs(f-line);let band=Math.exp(-(d*d)/(0.000038*(1+wi*.45)));e+=band*(.58/Math.sqrt(h))}}for(let p of [.08,.19,.31,.47,.62,.78,.91])e+=Math.exp(-((x-p)**2)/.00011)*(.11+Math.max(0,.9-y)*.24);e+=Math.exp(-((f-.16)**2)/.010)*.28;if(md.includes("Comb"))e*=.55+.45*Math.max(0,Math.cos(f*95));if(md.includes("Gate"))e=e>.30?e:e*.12;if(md.includes("Smear"))e=e*(1-am*.35)+Math.max(.15,e)*am*.35;if(md.includes("Shepard"))e+=Math.max(0,Math.sin(Math.log2(.08+f*8)*12+t))*am*.32;return Math.max(0,Math.min(1,e*.46))}
function color(e){const curve=e**1.55,r=Math.floor(8+curve*218),g=Math.floor(22+e*230),b=Math.floor(48+(e**.8)*76);return `rgb(${r},${g},${b})`}
function prepareReference(r){const w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));if(referenceWidth===w&&referenceHeight===h)return;referenceWidth=w;referenceHeight=h;referenceBuffer.width=w;referenceBuffer.height=h;referenceCtx.fillStyle="#101416";referenceCtx.fillRect(0,0,w,h);const factor=Math.max(w/reference.naturalWidth,h/reference.naturalHeight),dw=reference.naturalWidth*factor,dh=reference.naturalHeight*factor;referenceCtx.imageSmoothingEnabled=false;referenceCtx.drawImage(reference,(w-dw)/2,(h-dh)/2,dw,dh)}
function drawSpectrogram(c,r,phase){c.fillStyle="#101416";c.fillRect(0,0,r.width,r.height);if(reference.complete&&reference.naturalWidth){prepareReference(r);c.imageSmoothingEnabled=false;for(let y=0;y<r.height;y+=2){const sourcePosition=transformFreq(1-y/r.height);if(sourcePosition===null)continue;const sourceY=(1-sourcePosition)*referenceHeight;c.drawImage(referenceBuffer,0,sourceY,referenceWidth,2,0,y,r.width,2)}const md=modes[+mode.value];if(md==="Comb"){c.strokeStyle="rgba(10,14,16,.72)";c.lineWidth=3;for(let y=12;y<r.height;y+=28){c.beginPath();c.moveTo(0,y);c.lineTo(r.width,y);c.stroke()}}if(md==="Shepard W"){c.strokeStyle="rgba(84,221,183,.42)";c.lineWidth=2;for(let x=0;x<r.width;x+=46){c.beginPath();c.moveTo(x,0);c.lineTo(x+80,r.height);c.stroke()}}}else{for(let px=0;px<r.width;px+=2){for(let py=0;py<r.height;py+=2){const x=(px/r.width+phase)%1,y=py/r.height;const e=energyAt(x,y);if(e>.018){c.fillStyle=color(e);c.fillRect(px,py,3,3)}}}}c.strokeStyle="rgba(52,59,63,.72)";for(let i=0;i<=8;i++){c.beginPath();c.moveTo(0,i*r.height/8);c.lineTo(r.width,i*r.height/8);c.stroke()}for(let i=0;i<=12;i++){c.beginPath();c.moveTo(i*r.width/12,0);c.lineTo(i*r.width/12,r.height);c.stroke()}}
function drawSlice(){const r=slice.getBoundingClientRect();sctx.fillStyle="#0d1114";sctx.fillRect(0,0,r.width,r.height);sctx.strokeStyle="#54ddb7";sctx.lineWidth=1.7;sctx.beginPath();for(let px=0;px<r.width;px+=2){let x=px/r.width,e=energyAt(.64,1-x);let y=r.height-(e*.82+.05)*r.height;if(px===0)sctx.moveTo(px,y);else sctx.lineTo(px,y)}sctx.stroke();sctx.strokeStyle="rgba(239,173,62,.9)";sctx.beginPath();const pivotX=pivotPosition()*r.width;sctx.moveTo(pivotX,0);sctx.lineTo(pivotX,r.height);sctx.stroke()}
let lastFrame=0;function draw(now=0){if(now-lastFrame<33){requestAnimationFrame(draw);return}lastFrame=now;const r=scope.getBoundingClientRect();drawSpectrogram(ctx,r,frozen?0:t*.035);drawSlice();if(!frozen)t+=.033;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
</body>
</html>
